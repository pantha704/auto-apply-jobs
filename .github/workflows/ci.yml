name: CI

on:
  push:
    branches: [main, fix/p0-safety-fixes, codex/production-execution]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock -r requirements.txt -r requirements-dev.txt
          pip check

      - name: Syntax check all Python files
        run: python -m compileall -q .

      - name: Check undefined Python names and dashboard syntax
        run: |
          ruff check --select F821,F823 *.py workflow controlplane
          node --check controlplane/static/app.js

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock -r requirements.txt -r requirements-dev.txt
          pip check

      - name: Check for syntax errors in all Python files
        run: python -m py_compile *.py workflow/*.py controlplane/*.py tests/*.py
